pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,js,cjs,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.ts"
      run: bun run typecheck
    - name: comments
      glob: "src/**/*.ts"
      run: bun run comments

    - name: features
      glob: "features/**/*.feature"
      run: bun run features

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: arch
      run: bun run arch
    - name: test
      run: bun test
